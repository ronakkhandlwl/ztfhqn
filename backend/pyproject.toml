[project]
name = "winddesk"
version = "1.0.0"
description = "Day-ahead wind forecast desk for GB power procurement (Elexon BMRS FUELHH + WINDFOR)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.1,<2.4",
    "pandas>=2.2,<3",
    "tzdata>=2024.1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=winddesk --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
branch = true
source = ["winddesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD"]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
